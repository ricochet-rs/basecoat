on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: site.yaml

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website

      # Reference pages are generated from man/ by rd2qmd.
      - name: Install rd2qmd
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/eitsupi/rd2qmd/releases/latest/download/rd2qmd-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check rd2qmd is on PATH
        run: rd2qmd --version

      # The navbar icons are inlined from the phosphor SVGs at build time.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # build.R does library(basecoat), so the package has to be installed
      # rather than loaded from source.
      - name: Install basecoat
        run: R CMD INSTALL .

      - name: Build site
        run: Rscript dev/site/build.R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
