StylesPath = .vale
MinAlertLevel = suggestion
Vocab = Basecoat

Packages = Microsoft

[formats]
qmd = md
Rmd = md

[*.{md,qmd,Rmd,R}]
BasedOnStyles = Vale, Microsoft, Ricochet

Microsoft.Dashes = NO
Microsoft.Semicolon = NO
Microsoft.Headings = NO
Microsoft.HeadingColons = NO
Microsoft.OxfordComma = error
Microsoft.Contractions = NO
Microsoft.Passive = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Avoid = warning
Microsoft.Adverbs = NO

[*.R]
Ricochet.SentencePerLine = NO
Ricochet.HardWrap = NO
Microsoft.Quotes = NO
Microsoft.Ellipses = NO
Ricochet.Internals = NO
